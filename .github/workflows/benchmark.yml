name: Embed benchmark

on:
  # Hosted-runner timings are observations, so measurement is opt-in rather
  # than a timing-sensitive gate on every pull request.
  workflow_dispatch:
    inputs:
      samples:
        description: Samples per case
        type: choice
        default: '3'
        options: ['1', '3', '5', '10']
      case:
        description: Workload
        type: choice
        default: all
        options: [all, repeated, distinct, deep, large-note, rich-host]

permissions:
  contents: read

concurrency:
  group: benchmark-${{ github.ref }}
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OBSIDIAN_EMBEDS_BENCH_RUNS: ${{ inputs.samples }}
      BENCHMARK_CASE: ${{ inputs.case }}
      TERM: xterm-256color
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Prepare pinned benchmark dependencies
        run: |
          mkdir -p "$RUNNER_TEMP/benchmark"
          echo "NVIM_LOG_FILE=$RUNNER_TEMP/benchmark/nvim.log" >> "$GITHUB_ENV"
          sudo apt-get update && sudo apt-get install -y ripgrep
          # Reuse compatibility CI's verified downloads, fixing versions here
          # so benchmark runs do not silently change with upstream releases.
          python3 scripts/prepare-tests.py "$RUNNER_TEMP/test-deps" \
            --neovim v0.12.6 --obsidian minimum
          cp "$RUNNER_TEMP/test-deps/versions.json" "$RUNNER_TEMP/benchmark/versions.json"
      - name: Check runtime and benchmark observer
        run: |
          . "$RUNNER_TEMP/test-deps/env.sh"
          "$NVIM_BIN" --headless -u NONE -i NONE -l scripts/check-test-runtime.lua
          "$NVIM_BIN" --headless -u NONE -i NONE -l tests/obsidian-embeds-benchmark-observer-smoke.lua
      - name: Measure headless and terminal output sequentially
        run: |
          . "$RUNNER_TEMP/test-deps/env.sh"
          if [ "$BENCHMARK_CASE" != all ]; then
            export OBSIDIAN_EMBEDS_BENCH_CASE="$BENCHMARK_CASE"
          fi
          export OBSIDIAN_EMBEDS_BENCH_OUTPUT="$RUNNER_TEMP/benchmark/headless.json"
          "$NVIM_BIN" --headless -u NONE -i NONE -l tests/obsidian-embeds-benchmark.lua \
            > "$RUNNER_TEMP/benchmark/headless.log" 2>&1
          export OBSIDIAN_EMBEDS_BENCH_OUTPUT="$RUNNER_TEMP/benchmark/terminal.json"
          # Linux script allocates the terminal UI needed for frame observation.
          # --return propagates Neovim's failure status instead of masking it.
          script --quiet --return --command \
            "\"$NVIM_BIN\" -u NONE -i NONE -n -c \"lua dofile('tests/obsidian-embeds-benchmark.lua')\"" \
            "$RUNNER_TEMP/benchmark/terminal.log"
      - name: Publish Markdown summary
        if: always()
        run: |
          # Preserve successful headless results even if the terminal run fails.
          reports=()
          for report in "$RUNNER_TEMP/benchmark/headless.json" "$RUNNER_TEMP/benchmark/terminal.json"; do
            if [ -f "$report" ]; then reports+=("$report"); fi
          done
          if [ "${#reports[@]}" -gt 0 ]; then
            python3 scripts/report-benchmark.py "${reports[@]}" \
              --versions "$RUNNER_TEMP/benchmark/versions.json" \
              > "$RUNNER_TEMP/benchmark/summary.md"
            cat "$RUNNER_TEMP/benchmark/summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload samples, summary and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: embed-benchmark-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/benchmark/
          retention-days: 30
